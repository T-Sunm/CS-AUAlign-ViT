training:
  max_epochs: 256
  batch_size: 64
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.001
  num_workers: 4
  seed: 42
  device: cuda:0
  amp: true
  kmeans_interval: 10
  str_epochs: [25, 50, 75, 100, 125, 150, 175, 200, 225, 250]
loss:
  alpha: 1.0
  beta: 0.5
  gamma: 0.1
adversarial:
  hidden_dim: 256
  dropout: 0.5
  lambda_grl: 1.0
str:
  confidence_threshold: 0.95
preprocessing:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
