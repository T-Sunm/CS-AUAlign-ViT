model:
  backbone: swin_t
  weights: IMAGENET1K_V1
  num_classes: 7
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.001
  num_workers: 4
  seed: 42
  device: cuda:0
  amp: true
  validation_ratio: 0.1
  early_stopping_patience: 10
preprocessing:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
