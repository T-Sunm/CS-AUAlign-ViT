[project]
name = "cs-aualign-vit"
version = "0.1.0"
authors = [
    { name = "T-Sunm", email = "moonlig73@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=10.2,<10.3",
    "PyYAML>=6,<7",
    "torch>=2.2,<=2.3",
    "torchvision>=0.17,<=0.18",
]

[project.optional-dependencies]
preprocess = ["facenet-pytorch==2.6.0"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
